# LOCAL DEVELOPMENT ONLY: MLflow is unauthenticated and plaintext.
# Every published port is bound to localhost, never all network interfaces.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a password}
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/mlflow-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - s3://mlflow-artifacts
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # Development: host validation must not be disabled when exposing publicly.
      MLFLOW_ALLOWED_HOSTS: localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane/Dockerfile
    environment:
      CONTROL_API_KEY: ${CONTROL_API_KEY:?Set CONTROL_API_KEY}
      CONTROL_DATABASE_PATH: /data/control.db
      CONTROL_MLFLOW_URL: http://mlflow:5000
    volumes:
      - control_data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  control_data:
